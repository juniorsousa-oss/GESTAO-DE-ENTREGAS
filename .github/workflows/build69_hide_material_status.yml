name: Build 69 - hide material separation status

on:
  push:
    paths:
      - '.github/workflows/build69_hide_material_status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Build 69
        run: python scripts/build69_hide_material_status.py
      - name: Validate Python
        run: python -m py_compile streamlit_app.py
      - name: Validate hidden column
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('streamlit_app.py').read_text(encoding='utf-8')
          start = text.index('MATERIAL_HIDDEN_VIEW_COLS = [')
          end = text.index(']\n', start) + 2
          block = text[start:end]
          assert '"Status separação"' in block
          print('Status separação is hidden from material tables')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 69: hide material separation status column"
          git push
