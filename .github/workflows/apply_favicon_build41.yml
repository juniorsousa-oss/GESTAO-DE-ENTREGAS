name: Apply favicon build 41

on:
  push:
    paths:
      - '.github/workflows/apply_favicon_build41.yml'

permissions:
  contents: write

jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy MRP favicon and patch app
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/juniorsousa-oss/MRP-CONVERSOR/main/favicon.png.png \
            -o favicon.png.png
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          text = p.read_text(encoding='utf-8')
          old = 'page_icon="📦",'
          new = 'page_icon=str(Path(__file__).parent / "favicon.png.png"),'
          if old not in text:
              raise SystemExit('page_icon anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('APP core build 40', 'APP core build 41', 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile streamlit_app.py
          file favicon.png.png
      - name: Commit favicon
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py favicon.png.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use MRP favicon in deliveries app"
          git push
