name: Sidebar exact build 48

on:
  push:
    paths:
      - '.github/workflows/sidebar_exact_build48.yml'
      - 'scripts/sidebar_exact_build48.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply sidebar patch
        run: |
          python scripts/sidebar_exact_build48.py
          python -m py_compile streamlit_app.py
          grep -n 'APP core build 48' streamlit_app.py
          grep -n 'Build 48 — menu lateral' streamlit_app.py
      - name: Commit update
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine sidebar to validated visual"
          git push
