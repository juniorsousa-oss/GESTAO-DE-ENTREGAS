name: Build 83 enter behavior fix

on:
  push:
    paths:
      - '.github/workflows/build83_enter_behavior_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Enter behavior with clear buttons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          t = p.read_text(encoding='utf-8')

          def r(old, new, label, count=1):
              global t
              if old not in t:
                  raise SystemExit(f'marker not found: {label}')
              t = t.replace(old, new, count)
              print(label)

          # Hide the first submitter used exclusively to preserve Enter=Pesquisar.
          css_marker = '''    /* X compacto para limpeza individual de cada filtro. */\n'''
          css_add = '''    /* Primeiro submit invisível: garante que Enter sempre execute Pesquisar, nunca o X. */
              div[class*="st-key-filter_enter__"] {
                  display: none !important;
              }

          '''
          r(css_marker, css_add + css_marker, 'hidden Enter CSS')

          forms = [
              ('dashboard_filtros_form', 'dashboard_enter_submit', 'dashboard_filter_submit'),
              ('cronograma_filtros_form', 'cronograma_enter_submit', 'cronograma_filter_submit'),
              ('materiais_filtros_form', 'materiais_enter_submit', 'materiais_filter_submit'),
              ('nf_filtros_form', 'nf_enter_submit', 'nf_filter_submit'),
              ('historico_alertas_filtros_form', 'historico_enter_submit', 'historico_filter_submit'),
          ]
          for form_key, hidden_var, visible_var in forms:
              old = f'with st.form("{form_key}", clear_on_submit=False, enter_to_submit=True):\n'
              # Preserve indentation from the exact occurrence.
              idx = t.find(old)
              if idx < 0:
                  raise SystemExit(f'form not found: {form_key}')
              line_start = t.rfind('\n', 0, idx) + 1
              indent = t[line_start:idx]
              new = old + indent + '    ' + hidden_var + ' = st.form_submit_button(\n' + indent + '        "Pesquisar",\n' + indent + f'        key="filter_enter__{form_key}",\n' + indent + '        type="primary",\n' + indent + '        use_container_width=True,\n' + indent + '    )\n'
              t = t[:idx] + t[idx:].replace(old, new, 1)

              # Combine visible click with Enter-triggered hidden submit immediately after the visible button call.
              marker = indent + visible_var + ' = st.form_submit_button(\n' + indent + '    "Pesquisar", type="primary", use_container_width=True\n' + indent + ')\n'
              if marker not in t:
                  raise SystemExit(f'visible submit marker not found: {form_key}')
              replacement = marker + indent + visible_var + f' = bool({visible_var} or {hidden_var})\n'
              t = t.replace(marker, replacement, 1)

          # Material history has a multiline visible submit.
          form_key = 'material_history_filter_form'
          old = 'with st.form("material_history_filter_form", clear_on_submit=False, enter_to_submit=True):\n'
          idx = t.find(old)
          if idx < 0:
              raise SystemExit('material history form not found')
          line_start = t.rfind('\n', 0, idx) + 1
          indent = t[line_start:idx]
          new = old + indent + '    mh_enter_submit = st.form_submit_button(\n' + indent + '        "Pesquisar",\n' + indent + '        key="filter_enter__material_history_filter_form",\n' + indent + '        type="primary",\n' + indent + '        use_container_width=True,\n' + indent + '    )\n'
          t = t[:idx] + t[idx:].replace(old, new, 1)
          mh_marker = indent + 'mh_submit = st.form_submit_button(\n' + indent + '    "Pesquisar", type="primary", use_container_width=True\n' + indent + ')\n'
          if mh_marker not in t:
              raise SystemExit('material history visible submit not found')
          t = t.replace(mh_marker, mh_marker + indent + 'mh_submit = bool(mh_submit or mh_enter_submit)\n', 1)

          # Session trace: Enter only needs to submit the form; no result flag is required.
          form_key = 'history_session_filters_form'
          old = 'with st.form("history_session_filters_form", clear_on_submit=False, enter_to_submit=True):\n'
          idx = t.find(old)
          if idx < 0:
              raise SystemExit('session history form not found')
          line_start = t.rfind('\n', 0, idx) + 1
          indent = t[line_start:idx]
          new = old + indent + '    st.form_submit_button(\n' + indent + '        "Pesquisar",\n' + indent + '        key="filter_enter__history_session_filters_form",\n' + indent + '        type="primary",\n' + indent + '        use_container_width=True,\n' + indent + '    )\n'
          t = t[:idx] + t[idx:].replace(old, new, 1)

          p.write_text(t, encoding='utf-8')
          PY
      - name: Validate syntax
        run: python -m py_compile streamlit_app.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build 83: preserve Enter search with clear controls"
          git push
