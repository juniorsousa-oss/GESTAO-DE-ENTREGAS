name: Build 59 - NF nature filter

on:
  push:
    paths:
      - '.github/workflows/filter_nf_natures_build59.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/filter_nf_natures_build59.py
      - name: Validate Python
        run: python -m py_compile streamlit_app.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 59: restrict NFs to operational natures"
          git push

# retry 2
