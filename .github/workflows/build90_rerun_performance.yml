name: Build 90 Streamlit rerun performance

on:
  push:
    paths:
      - '.github/workflows/build90_rerun_performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/build90_rerun_performance.py
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Syntax and repeated-rerun smoke test
        run: |
          python -m py_compile streamlit_app.py
          python - <<'PY'
          import streamlit as st
          from streamlit.delta_generator import DeltaGenerator
          from streamlit.testing.v1 import AppTest
          app=AppTest.from_file("streamlit_app.py", default_timeout=60)
          base=None
          for run in range(12):
              app.run()
              assert not app.exception, [e.message for e in app.exception]
              current=(st.markdown,DeltaGenerator.radio,
                       DeltaGenerator.multiselect,DeltaGenerator.dataframe)
              assert current[0].__globals__['_original_markdown'].__name__ != '_markdown_ui'
              assert current[1].__globals__['_original_radio'].__name__ != '_radio_ui'
              assert current[2].__globals__['_original_multiselect'].__name__ != '_multiselect_ui'
              assert current[3].__globals__['_original_dataframe'].__name__ != '_dataframe_ui'
              depth=tuple(current)
              if base is not None:
                  assert len(depth)==len(base)
              base=depth
          print("TWELVE_RERUNS_NO_WRAPPER_CHAIN")
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          git commit -m 'Build 90: eliminate accumulating Streamlit render wrappers' || exit 0
          git push
