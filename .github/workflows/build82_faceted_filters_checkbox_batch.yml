name: Build 82 faceted filters checkbox batching

on:
  push:
    paths:
      - '.github/workflows/build82_faceted_filters_checkbox_batch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Build 82 patch
        run: python scripts/build82_faceted_filters_checkbox_batch.py
      - name: Validate syntax
        run: python -m py_compile streamlit_app.py
      - name: Commit Build 82
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 82: faceted filters checkbox batching and delivered terminal statuses"
          git push
