name: Flatten runtime build 37

on:
  push:
    paths:
      - '.github/workflows/flatten_runtime_build37.yml'
      - 'scripts/flatten_runtime_build37.py'

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build flat runtime
        run: |
          python scripts/flatten_runtime_build37.py
          python -m py_compile streamlit_app.py
      - name: Commit flat runtime
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Flatten Streamlit runtime and restore native sidebar width"
          git push
