name: Apply historical menu fix

on:
  push:
    paths:
      - '.github/workflows/fix_historical_menu.yml'

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Apply direct historical menu fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch application files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app_main.py')
          text = app.read_text(encoding='utf-8')
          old_menu = 'page = st.radio("Página", ["Dashboard", "Cronograma", "Materiais", "Histórico"], label_visibility="collapsed")'
          new_menu = 'page = st.radio("Página", ["Dashboard", "Cronograma", "Carga histórica", "Materiais", "Histórico"], label_visibility="collapsed")'
          if old_menu not in text:
              raise SystemExit('Trecho do menu original não encontrado em app_main.py')
          app.write_text(text.replace(old_menu, new_menu, 1), encoding='utf-8')

          wrapper = Path('streamlit_app.py')
          w = wrapper.read_text(encoding='utf-8')
          old_date = '''        with st.container(border=True):\n            c1, c2 = st.columns([2.2, 1])\n            with c1:\n                st.markdown(f"**{uploaded.name}**")\n            with c2:\n                ref = st.date_input(\n                    "Data de referência",\n                    value=min(default_date, date.today()),\n                    min_value=date(2026, 1, 1),\n                    max_value=date.today(),\n                    key=f"hist_ref_{idx}_{uploaded.name}",\n                    format="DD/MM/YYYY",\n                )\n            dates.append(ref)'''
          new_date = '''        with st.container(border=True):\n            st.markdown(f"**Arquivo: {uploaded.name}**")\n            st.caption("Informe obrigatoriamente a data à qual este relatório pertence.")\n            ref = st.date_input(\n                "Data de referência deste arquivo",\n                value=min(default_date, date.today()),\n                min_value=date(2026, 1, 1),\n                max_value=date.today(),\n                key=f"hist_ref_{idx}_{uploaded.name}",\n                format="DD/MM/YYYY",\n            )\n            dates.append(ref)'''
          if old_date not in w:
              raise SystemExit('Trecho do seletor de data não encontrado em streamlit_app.py')
          w = w.replace(old_date, new_date, 1)
          w = w.replace('st.sidebar.caption("UI build 05")', 'st.sidebar.caption("UI build 06")')
          wrapper.write_text(w, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_main.py streamlit_app.py
          git commit -m "Fix historical load menu and reference date"
          git push
