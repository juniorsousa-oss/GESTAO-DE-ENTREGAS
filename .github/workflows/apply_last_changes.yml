name: Apply last change dates patch

on:
  push:
    paths:
      - '.github/workflows/apply_last_changes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix runtime patch
        run: python scripts/fix_runtime_last_changes.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_runtime_v8.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix runtime parsing for separation change date"
          git push
