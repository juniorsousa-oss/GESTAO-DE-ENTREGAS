name: Build 66 - runtime fix

on:
  push:
    paths:
      - '.github/workflows/build66_runtime_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply runtime fix
        run: python scripts/build66_runtime_fix.py
      - name: Validate Python
        run: python -m py_compile streamlit_app.py
      - name: Validate helper ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('streamlit_app.py').read_text(encoding='utf-8')
          assert text.find('def _fmt_feed_datetime(value):') < text.find('elif page == "NFs":')
          print('helper ordering ok')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 66: fix NFs runtime helper ordering"
          git push
