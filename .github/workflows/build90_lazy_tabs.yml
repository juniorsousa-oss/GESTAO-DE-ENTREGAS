name: Build 90 lazy tabs performance

on:
  push:
    paths:
      - '.github/workflows/build90_lazy_tabs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch app
        run: python scripts/build90_lazy_tabs.py
      - name: Validate syntax
        run: python -m py_compile streamlit_app.py
      - name: Validate tabs
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('streamlit_app.py').read_text(encoding='utf-8')
          for marker in ('cronograma_tabs','materiais_tabs','historico_tabs','alimentacao_tabs'):
              assert marker in text, marker
          for marker in ('history_tab_general','history_tab_materials','history_tab_users','history_tab_archive','history_tab_feed','tab_current','tab_pcp'):
              assert 'if _tab_visible(' + marker + '):' in text, marker
          print('Build 90 structural checks OK')
          PY
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m 'Build 90: load only active tab content' || exit 0
          git push
