name: Build 86 material pending without stock filter

on:
  push:
    paths:
      - '.github/workflows/build86_material_pending_without_stock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Build 86 patch
        run: python scripts/build86_material_pending_without_stock.py
      - name: Validate syntax
        run: python -m py_compile streamlit_app.py
      - name: Validate markers
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('streamlit_app.py').read_text(encoding='utf-8')
          assert 'APP_BUILD = 86' in t
          assert 'APP core build 86' in t
          assert '["SIM", "NÃO", "PENDÊNCIA SEM ESTOQUE"]' in t
          print('Build 86 validation OK')
          PY
      - name: Commit Build 86
        run: |
          git config user.name 'juniorsousa-oss'
          git config user.email 'juniorsousa@unipam.edu.br'
          git add streamlit_app.py
          git commit -m 'Build 86: add pending projects without stock material filter' || exit 0
          git push
