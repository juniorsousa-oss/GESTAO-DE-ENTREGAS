name: Fix operational v2 validation

on:
  push:
    paths:
      - '.github/workflows/fix_operational_v2_validation.yml'
      - 'scripts/fix_operational_v2_validation.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply validation fix
        run: |
          python scripts/fix_operational_v2_validation.py
          python -m py_compile streamlit_app.py
          if grep -n "new_date > ref_date" streamlit_app.py | head -20; then true; fi
      - name: Commit update
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix operational v2 date validation"
          git push
