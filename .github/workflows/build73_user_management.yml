name: Build 73 - user management

on:
  push:
    paths:
      - '.github/workflows/build73_user_management.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Build 73
        run: python scripts/build73_user_management.py
      - name: Validate Python
        run: python -m py_compile streamlit_app.py
      - name: Validate user management
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('streamlit_app.py').read_text(encoding='utf-8')
          checks = [
              '"list_operators": "entrega_listar_operadores"',
              '"create_operator": "entrega_criar_operador"',
              '"delete_operator": "entrega_excluir_operador"',
              'def _load_operator_options(force=False):',
              '"Gestão de usuários"',
              'Cadastrar usuário',
              'Excluir usuário',
              'APP core build 73',
              'UI build 31',
          ]
          missing = [x for x in checks if x not in text]
          assert not missing, missing
          assert 'placeholder="Informe seu nome para executar ações nesta sessão."' not in text
          print('Build 73 validation OK')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 73: add persistent operator user management"
          git push
