name: Remove dashboard last-change cards

on:
  push:
    paths:
      - '.github/workflows/remove_dashboard_last_change_cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/remove_dashboard_last_change_cards.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add app_main.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Remove dashboard last-change cards"
          git push
