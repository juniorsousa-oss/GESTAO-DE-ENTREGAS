name: Build 84 retry

on:
  push:
    paths:
      - '.github/workflows/build84_retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Build 84 patch
        run: python scripts/build84_single_clear_and_theme_color.py
      - name: Remove duplicated boundary lines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          t = p.read_text(encoding='utf-8')
          lines = [
              '        st.caption("Filtros independentes: após Pesquisar/Enter, cada lista mostra somente opções compatíveis com os demais filtros ativos.")\n',
              '            st.caption("Filtros independentes: cada opção é recalculada usando os demais filtros ativos, sem ordem obrigatória.")\n',
              '        st.caption("Filtros independentes: após Pesquisar/Enter, cada lista considera todos os outros filtros ativos. A seleção de materiais reutiliza o resultado em memória.")\n',
              '        st.caption("Os filtros são aplicados somente ao clicar em Pesquisar ou pressionar Enter.")\n',
              '        st.caption("A consulta é executada somente ao clicar em Pesquisar ou pressionar Enter.")\n',
              '        if "_material_history_rows" not in st.session_state or mh_submit:\n',
              '            view = hist.copy()\n',
          ]
          for line in lines:
              while line + line in t:
                  t = t.replace(line + line, line)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Validate syntax and Build 84 markers
        shell: bash
        run: |
          python -m py_compile streamlit_app.py
          python - <<'PY'
          from pathlib import Path
          t = Path('streamlit_app.py').read_text(encoding='utf-8')
          assert 'APP_BUILD = 84' in t
          assert '_filter_clear_submit(' not in t
          assert 'filter_enter__' not in t
          assert t.count('filter_clear_group__') >= 7
          assert 'entrega_salvar_cor_botoes' in t
          assert 'st.color_picker(' in t
          print('Build 84 validation passed')
          PY
      - name: Commit Build 84
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 84: single filter clear and configurable button color"
          git push
