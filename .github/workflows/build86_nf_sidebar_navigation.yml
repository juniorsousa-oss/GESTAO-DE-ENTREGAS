name: Build 86 NF sidebar navigation parity

on:
  push:
    paths:
      - '.github/workflows/build86_nf_sidebar_navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Build 86 patch
        run: python scripts/build86_nf_sidebar_navigation.py
      - name: Validate syntax
        run: python -m py_compile streamlit_app.py
      - name: Validate menu markers
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('streamlit_app.py').read_text(encoding='utf-8')
          assert 'APP_BUILD = 86' in t
          assert 'APP core build 86' in t
          assert 'Build 86 — navegação igual ao Controle de NFs' in t
          assert 'justify-content: flex-start !important;' in t
          assert 'background: #111827 !important;' in t
          assert 'background: #ef4444 !important;' in t
          print('Build 86 navigation validation OK')
          PY
      - name: Commit Build 86
        run: |
          git config user.name 'juniorsousa-oss'
          git config user.email 'juniorsousa@unipam.edu.br'
          git add streamlit_app.py
          git commit -m 'Build 86: match sidebar navigation to NF app' || exit 0
          git push
