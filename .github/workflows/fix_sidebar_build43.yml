name: Fix sidebar build 43

on:
  push:
    paths:
      - '.github/workflows/fix_sidebar_build43.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply fix
        run: |
          python scripts/fix_sidebar_build43.py
          python -m py_compile streamlit_app.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix logo password state and sidebar navigation"
          git push
