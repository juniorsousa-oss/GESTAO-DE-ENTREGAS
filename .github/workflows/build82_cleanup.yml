name: Build 82 cleanup

on:
  push:
    paths:
      - '.github/workflows/build82_cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate material selection line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          t = p.read_text(encoding='utf-8')
          dup = '''                    selected = edited[edited["Selecionar"].fillna(False).astype(bool)].copy()\n                    selected = edited[edited["Selecionar"].fillna(False).astype(bool)].copy()\n'''
          one = '''                    selected = edited[edited["Selecionar"].fillna(False).astype(bool)].copy()\n'''
          if dup not in t:
              raise SystemExit('duplicate selection marker not found')
          p.write_text(t.replace(dup, one, 1), encoding='utf-8')
          PY
      - name: Validate syntax
        run: python -m py_compile streamlit_app.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build 82: clean material selection state"
          git push
