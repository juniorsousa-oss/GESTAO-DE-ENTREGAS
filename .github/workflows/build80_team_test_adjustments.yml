name: Build 80 team test adjustments

on:
  push:
    paths:
      - '.github/workflows/build80_team_test_adjustments.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/build80_team_test_adjustments.py
      - name: Validate syntax
        run: python -m py_compile streamlit_app.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 80: apply production team test rules"
          git push
