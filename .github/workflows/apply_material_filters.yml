name: Apply material filters

on:
  push:
    paths:
      - '.github/workflows/apply_material_filters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch materials filters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app_main.py')
          text = path.read_text(encoding='utf-8')

          old = '''            search = st.text_input("Buscar Projeto / Produto / Descrição")
            view = materials.copy()
            if search.strip():
                term = search.strip().lower()
                mask = (
                    view["Projeto"].astype(str).str.lower().str.contains(term, na=False)
                    | view["Produto"].astype(str).str.lower().str.contains(term, na=False)
                    | view["Descrição"].astype(str).str.lower().str.contains(term, na=False)
                )
                view = view[mask]
'''

          new = '''            f_projeto, f_pendencia = st.columns([2.2, 1])
            projeto_filtro = f_projeto.text_input(
                "Projeto",
                placeholder="Digite a OP / Projeto",
            )
            pendencia_filtro = f_pendencia.selectbox(
                "Condição de pendência",
                ["Todos", "SIM", "NÃO"],
                index=0,
            )

            view = materials.copy()
            if projeto_filtro.strip():
                term = projeto_filtro.strip().lower()
                view = view[
                    view["Projeto"].astype(str).str.lower().str.contains(term, na=False)
                ]

            if pendencia_filtro != "Todos" and "Condição de pendência" in view.columns:
                view = view[
                    view["Condição de pendência"]
                    .fillna("")
                    .astype(str)
                    .str.upper()
                    .eq(pendencia_filtro)
                ]
'''

          if old not in text:
              raise SystemExit('Bloco antigo de filtros de Materiais não encontrado')

          text = text.replace(old, new, 1)
          text = text.replace('st.caption("APP core build 21")', 'st.caption("APP core build 22")', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add app_main.py
          git commit -m "Add separate project and pending filters"
          git push
