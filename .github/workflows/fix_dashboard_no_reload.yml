name: Fix dashboard no reload

on:
  push:
    paths:
      - '.github/workflows/fix_dashboard_no_reload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/fix_dashboard_no_reload.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add app_main.py streamlit_ui_legacy.py streamlit_runtime_v8.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Avoid full page reload on dashboard filters"
          git push
