name: Add NFs build 46

on:
  push:
    paths:
      - '.github/workflows/add_nfs_build46.yml'
      - 'scripts/add_nfs_build46.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply NF patch
        run: |
          python scripts/add_nfs_build46.py
          python -m py_compile streamlit_app.py
          grep -n 'elif page == "NFs"' streamlit_app.py
          grep -n 'APP core build 46' streamlit_app.py
      - name: Commit update
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add NFs processing page"
          git push
