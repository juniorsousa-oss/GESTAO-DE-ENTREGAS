name: Optimize bootstrap and sidebar

on:
  push:
    paths:
      - '.github/workflows/optimize_bootstrap_and_sidebar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/optimize_bootstrap_and_sidebar.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_ui_legacy.py app_main.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Optimize startup bootstrap and restore sidebar width"
          git push
