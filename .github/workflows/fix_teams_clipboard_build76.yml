name: Fix Teams clipboard build 76

on:
  push:
    paths:
      - '.github/workflows/fix_teams_clipboard_build76.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/fix_teams_clipboard_build76.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 76: copy Teams message before opening chat"
          git push
