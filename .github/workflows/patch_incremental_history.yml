      - name: Commit patched app and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git rm .github/workflows/patch_incremental_history.yml
          git commit -m "Fix incremental historical comparison and load visibility"
          git push
