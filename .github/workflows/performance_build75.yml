name: Performance build 75

on:
  push:
    paths:
      - 'patch_performance_build75.py'
      - '.github/workflows/performance_build75.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python patch_performance_build75.py
      - name: Compile
        run: python -m py_compile streamlit_app.py
      - name: Verify markers
        run: |
          grep -q 'APP core build 75' streamlit_app.py
          grep -q 'load_material_view' streamlit_app.py
          grep -q 'entrega_materiais_consulta' streamlit_app.py
          grep -q '"limit": 500' streamlit_app.py
      - name: Commit app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          git commit -m 'Build 75: optimize Materials and NF loading'
          git push
