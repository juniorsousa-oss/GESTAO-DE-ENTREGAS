name: Sidebar center text build 50

on:
  push:
    paths:
      - '.github/workflows/sidebar_center_text_build50.yml'
      - 'scripts/sidebar_center_text_build50.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply build 50 patch
        run: |
          python scripts/sidebar_center_text_build50.py
          python -m py_compile streamlit_app.py
          grep -n 'APP core build 50' streamlit_app.py
          grep -n 'Build 50' streamlit_app.py
      - name: Commit update
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Center sidebar navigation labels"
          git push
