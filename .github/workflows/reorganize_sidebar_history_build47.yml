name: Reorganize sidebar and history build 47

on:
  push:
    paths:
      - '.github/workflows/reorganize_sidebar_history_build47.yml'
      - 'scripts/reorganize_sidebar_history_build47.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply build 47 patch
        run: |
          python scripts/reorganize_sidebar_history_build47.py
          python -m py_compile streamlit_app.py
          grep -n 'APP core build 47' streamlit_app.py
          grep -n 'history_tab_general' streamlit_app.py
          grep -n 'def _render_feeding_center' streamlit_app.py
          grep -n 'main_navigation' streamlit_app.py
      - name: Commit update
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Reorganize navigation and centralize data feeds"
          git push
