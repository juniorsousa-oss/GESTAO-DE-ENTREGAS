name: Sidebar remove circle build 53

on:
  push:
    paths:
      - '.github/workflows/sidebar_remove_circle_build53.yml'
      - 'scripts/sidebar_remove_circle_build53.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply build 53 patch
        run: |
          python scripts/sidebar_remove_circle_build53.py
          python -m py_compile streamlit_app.py
          grep -n 'APP core build 53' streamlit_app.py
          grep -n 'Build 53' streamlit_app.py
      - name: Commit update
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Remove sidebar radio circles"
          git push
