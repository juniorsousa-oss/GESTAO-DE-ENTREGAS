name: Persist logo build 40

on:
  push:
    paths:
      - '.github/workflows/persist_logo_build40.yml'
      - 'scripts/persist_logo_build40.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python scripts/persist_logo_build40.py
          python -m py_compile streamlit_app.py
      - name: Commit update
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Persist custom header logo in Supabase"
          git push
