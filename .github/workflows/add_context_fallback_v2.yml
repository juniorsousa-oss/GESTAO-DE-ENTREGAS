name: Add context fallback v2

on:
  push:
    paths:
      - '.github/workflows/add_context_fallback_v2.yml'
      - 'scripts/add_context_fallback_v2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply fallback
        run: |
          python scripts/add_context_fallback_v2.py
          python -m py_compile streamlit_app.py
      - name: Commit update
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Keep legacy status logic until contextual MRP load"
          git push
