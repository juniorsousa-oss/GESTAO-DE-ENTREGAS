name: Fix build 78 json import

on:
  push:
    paths:
      - '.github/workflows/fix_json_import_build78.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/fix_json_import_build78.py
      - name: Validate runtime imports
        run: |
          python -m py_compile streamlit_app.py
          python - <<'PY'
          from pathlib import Path
          head='\n'.join(Path('streamlit_app.py').read_text(encoding='utf-8').splitlines()[:20])
          assert 'import json' in head
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 78: fix shared cache json import"
          git push
