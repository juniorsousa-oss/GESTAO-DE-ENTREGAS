name: Apply automatic status rules

on:
  push:
    paths:
      - '.github/workflows/apply_automatic_status_rules.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/apply_automatic_status_rules.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add app_main.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply automatic project status rules"
          git push
