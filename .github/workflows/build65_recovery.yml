name: Build 65 - recovery

on:
  push:
    paths:
      - '.github/workflows/build65_recovery.yml'

permissions:
  contents: write

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recovery
        run: python scripts/recover_build65.py
      - name: Validate Python
        run: python -m py_compile streamlit_app.py
      - name: Commit recovered app
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 65: recover app stability and preserve operational rules"
          git push
