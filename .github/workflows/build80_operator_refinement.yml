name: Build 80 operator refinement

on:
  push:
    paths:
      - '.github/workflows/build80_operator_refinement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build80_operator_refinement.py
      - run: python -m py_compile streamlit_app.py
      - shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build 80: refine operator switching"
          git push
