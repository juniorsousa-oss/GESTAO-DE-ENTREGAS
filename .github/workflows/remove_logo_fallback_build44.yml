name: Remove provisional logo password build 44

on:
  push:
    paths:
      - '.github/workflows/remove_logo_fallback_build44.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python scripts/remove_logo_fallback_build44.py
          python -m py_compile streamlit_app.py
      - name: Commit update
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use only Streamlit Secret for logo admin password"
          git push
