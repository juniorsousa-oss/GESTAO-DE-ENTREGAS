name: Build 81 filters exports performance

on:
  push:
    paths:
      - '.github/workflows/build81_filters_exports_performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/build81_filters_exports_performance.py
      - name: Validate syntax
        run: python -m py_compile streamlit_app.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 81: stabilize filters exports and critical alerts"
          git push
