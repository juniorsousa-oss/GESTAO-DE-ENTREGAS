name: Build 83 enter behavior fix v2

on:
  push:
    paths:
      - '.github/workflows/build83_enter_behavior_fix_v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Enter behavior with clear buttons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          t = p.read_text(encoding='utf-8')

          css_marker = '    /* X compacto para limpeza individual de cada filtro. */\n'
          css_add = '''    /* Primeiro submit invisível: Enter sempre executa Pesquisar, nunca o X. */
              div[class*="st-key-filter_enter__"] {
                  display: none !important;
              }

          '''
          if css_marker not in t:
              raise SystemExit('CSS marker not found')
          t = t.replace(css_marker, css_add + css_marker, 1)

          forms = [
              ('dashboard_filtros_form', 'dashboard_enter_submit', 'dashboard_filter_submit'),
              ('cronograma_filtros_form', 'cronograma_enter_submit', 'cronograma_filter_submit'),
              ('materiais_filtros_form', 'materiais_enter_submit', 'materiais_filter_submit'),
              ('nf_filtros_form', 'nf_enter_submit', 'nf_filter_submit'),
              ('historico_alertas_filtros_form', 'historico_enter_submit', 'historico_filter_submit'),
          ]

          for form_key, hidden_var, visible_var in forms:
              token = f'with st.form("{form_key}", clear_on_submit=False, enter_to_submit=True):\n'
              idx = t.find(token)
              if idx < 0:
                  raise SystemExit(f'form not found: {form_key}')
              line_start = t.rfind('\n', 0, idx) + 1
              base_indent = t[line_start:idx]
              inner = base_indent + '    '
              hidden = (
                  token
                  + inner + hidden_var + ' = st.form_submit_button(\n'
                  + inner + '    "Pesquisar",\n'
                  + inner + f'    key="filter_enter__{form_key}",\n'
                  + inner + '    type="primary",\n'
                  + inner + '    use_container_width=True,\n'
                  + inner + ')\n'
              )
              t = t[:idx] + t[idx:].replace(token, hidden, 1)

              visible = (
                  inner + visible_var + ' = st.form_submit_button(\n'
                  + inner + '    "Pesquisar", type="primary", use_container_width=True\n'
                  + inner + ')\n'
              )
              if visible not in t:
                  raise SystemExit(f'visible submit not found: {form_key}')
              t = t.replace(
                  visible,
                  visible + inner + visible_var + f' = bool({visible_var} or {hidden_var})\n',
                  1,
              )

          # Material history.
          form_key = 'material_history_filter_form'
          token = 'with st.form("material_history_filter_form", clear_on_submit=False, enter_to_submit=True):\n'
          idx = t.find(token)
          if idx < 0:
              raise SystemExit('material history form not found')
          line_start = t.rfind('\n', 0, idx) + 1
          base_indent = t[line_start:idx]
          inner = base_indent + '    '
          hidden = (
              token
              + inner + 'mh_enter_submit = st.form_submit_button(\n'
              + inner + '    "Pesquisar",\n'
              + inner + '    key="filter_enter__material_history_filter_form",\n'
              + inner + '    type="primary",\n'
              + inner + '    use_container_width=True,\n'
              + inner + ')\n'
          )
          t = t[:idx] + t[idx:].replace(token, hidden, 1)
          visible = (
              inner + 'mh_submit = st.form_submit_button(\n'
              + inner + '    "Pesquisar", type="primary", use_container_width=True\n'
              + inner + ')\n'
          )
          if visible not in t:
              raise SystemExit('material history visible submit not found')
          t = t.replace(visible, visible + inner + 'mh_submit = bool(mh_submit or mh_enter_submit)\n', 1)

          # Session trace only needs hidden first submit for Enter.
          form_key = 'history_session_filters_form'
          token = 'with st.form("history_session_filters_form", clear_on_submit=False, enter_to_submit=True):\n'
          idx = t.find(token)
          if idx < 0:
              raise SystemExit('session history form not found')
          line_start = t.rfind('\n', 0, idx) + 1
          base_indent = t[line_start:idx]
          inner = base_indent + '    '
          hidden = (
              token
              + inner + 'st.form_submit_button(\n'
              + inner + '    "Pesquisar",\n'
              + inner + '    key="filter_enter__history_session_filters_form",\n'
              + inner + '    type="primary",\n'
              + inner + '    use_container_width=True,\n'
              + inner + ')\n'
          )
          t = t[:idx] + t[idx:].replace(token, hidden, 1)

          p.write_text(t, encoding='utf-8')
          print('Enter behavior fixed')
          PY
      - name: Validate syntax
        run: python -m py_compile streamlit_app.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build 83: keep Enter mapped to search"
          git push
