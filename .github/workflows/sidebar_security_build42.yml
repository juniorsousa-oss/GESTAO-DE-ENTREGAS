name: Apply sidebar security build 42

on:
  push:
    paths:
      - '.github/workflows/sidebar_security_build42.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply sidebar patch
        run: |
          python scripts/sidebar_security_build42.py
          python -m py_compile streamlit_app.py
      - name: Commit sidebar update
        shell: bash
        run: |
          git config user.name "juniorsousa-oss"
          git config user.email "juniorsousa@unipam.edu.br"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve sidebar navigation and protect logo settings"
          git push
