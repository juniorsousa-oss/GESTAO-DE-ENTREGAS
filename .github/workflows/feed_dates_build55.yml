name: Feed dates build 55

on:
  push:
    paths:
      - 'patch_feed_dates_build55.py'
      - '.github/workflows/feed_dates_build55.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python patch_feed_dates_build55.py
      - name: Validate Python
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Show last report load dates build 55"
            git push
          fi
