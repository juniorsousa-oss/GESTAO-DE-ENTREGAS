name: Build 88 fixed Data CM material filter

on:
  push:
    paths:
      - '.github/workflows/build88_material_data_cm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/build88_material_data_cm.py
      - name: Validate syntax
        run: python -m py_compile streamlit_app.py
      - name: Validate rules
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('streamlit_app.py').read_text(encoding='utf-8')
          assert 'APP_BUILD = 88' in t
          assert 'data_campo_atual = "Data CM"' in t
          assert '"Data CM",\n                data_options' in t
          assert 'st.session_state.get("materiais_data_campo", "Última Solicitação")' not in t
          print('Build 88 OK')
          PY
      - name: Commit
        run: |
          git config user.name 'juniorsousa-oss'
          git config user.email 'juniorsousa@unipam.edu.br'
          git add streamlit_app.py
          git commit -m 'Build 88: fix material date filter to Data CM' || exit 0
          git push
