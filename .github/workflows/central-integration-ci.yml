name: Validar Central Gestão Entregas

on:
  push:
    branches: [main]
    paths:
      - 'streamlit_app.py'
      - 'central_entregas_data.py'
      - 'setta_shell.py'
      - 'entrega_api.py'
      - 'setta_auth.py'
      - 'requirements.txt'
      - '.github/workflows/central-integration-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Compilar integração
        run: |
          python -m py_compile streamlit_app.py central_entregas_data.py setta_shell.py entrega_api.py setta_auth.py
      - name: Validar pontos da Central
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("streamlit_app.py").read_text(encoding="utf-8")
          central = Path("central_entregas_data.py").read_text(encoding="utf-8")
          assert "def _sync_central_operational_feeds" in app
          assert '"central_current_load"' in app
          assert '"relatorio_mrp"' in app
          assert '"for022"' in app
          assert '"nf"' in app
          assert 'with st.expander("CONTINGÊNCIA"' in app
          assert "bundle_state" in central
          assert "visual_get" in central
          assert "def _sync_central_operational_feeds(force=False):" in app
          assert '_sync_central_operational_feeds(force=False)' in app
          assert '_sync_central_operational_feeds(force=True)' not in app
          assert 'with st.spinner("VERIFICANDO E ATUALIZANDO CRONOGRAMA, MATERIAIS E NFS...")' not in app
          assert 'row.get("source_updated_at") or row.get("synced_at")' in app
          assert "ÚLTIMA ATUALIZAÇÃO" in app
          assert 'key="setta_drawer_toggle"' in app
          assert '"ui_config": row.get("ui_config") or {}' in central
          shell = Path("setta_shell.py").read_text(encoding="utf-8")
          api = Path("entrega_api.py").read_text(encoding="utf-8")
          auth = Path("setta_auth.py").read_text(encoding="utf-8")
          assert "SETTA UI — App Shell Rounded V1" in shell
          assert "max-width:1680px!important" in shell
          assert "width:260px!important" in shell
          assert "entrega_api.call(" in app
          assert "setta_auth.authenticate(" in app
          assert "_render_setta_auth_gate()" in app
          assert 'payload.get("responsavel") or _session_operator()' in app
          assert '"operahub_auth_user"' in auth
          assert '"operahub_bootstrap"' in auth
          assert "HTTP_SESSION = requests.Session()" in api
          assert "requests.post(" not in app
          assert "setta_shell.render_shell(" in app
          assert "SETTA UI — App Shell Rounded V1" not in app
          assert "st.markdown = _markdown_ui" not in app
          assert "DeltaGenerator.metric" not in app
          assert "DeltaGenerator.dataframe" not in app
          assert app.count("def _fmt_feed_datetime(value):") == 1
          assert app.count("def _fmt_feed_date(value):") == 1
          for dead_name in (
              "_load_operator_options",
              "_sync_materials_from_supabase",
              "import_schedule",
              "change_status",
              "add_comment",
              "close_treatment",
              "find_col",
              "_logo_admin_password_valid",
          ):
              assert f"def {dead_name}(" not in app, dead_name
          assert "_entrega_nav_query_consumed" in app
          assert not Path("sitecustomize.py").exists()
          for legacy in (
              "app_main.py",
              "streamlit_runtime_v8.py",
              "streamlit_ui_legacy.py",
              "scripts/priority_build54.py",
              "scripts/build66_runtime_fix.py",
              "scripts/build67_material_pending_schedule.py",
              "scripts/build68_material_pending_from_dashboard.py",
          ):
              assert not Path(legacy).exists(), legacy
          print("CENTRAL_ENTREGAS_COMPILE_OK")
          PY
